  <!-- House body -->
  <rect x="14" y="30" width="36" height="28" fill="url(#houseGradient)" rx="2"/>
  
  <!-- Door -->
  <rect x="26" y="44" width="12" height="14" fill="#34495E" rx="1"/>
  
  <!-- Window left -->
  <rect x="18" y="36" width="8" height="8" fill="#F39C12" rx="0.5"/>
  
  <!-- Window right -->
